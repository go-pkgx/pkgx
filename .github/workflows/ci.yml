name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race -coverprofile=cov.out ./...
      - run: go tool cover -func=cov.out | tail -1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          # The qemu lanes vary the ARCHITECTURE and hold the OS fixed. The BSDs
          # are the other dimension: same amd64, a different kernel and libc.
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: loong64
          # s390x is BIG-ENDIAN, and nothing else in this matrix is.
          - goos: linux
            goarch: s390x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # A CGO_ENABLED=0 build must be fully static on every 64-bit target,
      # so pkgx can ship on a `FROM scratch` image (or, on windows, a lone .exe).
      - env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags='-s -w' -o pkgx-${{ matrix.goos }}-${{ matrix.goarch }} .

  # Proof-of-concept: build pkgx.exe natively on a real Windows runner, fabricate
  # a tiny Windows pkgx bottle (a PE built by the runner's Go toolchain, laid out
  # as <project>/windows/x86-64/{versions.txt,v1.0.0.tar.gz}), serve dist/ over
  # HTTP, and prove `pkgx.exe <project>` fetches the bottle, resolves the .exe,
  # execs it, and both its output AND its exit code propagate.
  #
  # NB: pkgx depends on github.com/go-pkgx/bottle via a tagged version; the
  # windows run-path lives in that module. This job checks out go-pkgx/bottle
  # alongside and `replace`s it locally, so it goes green once the windows bottle
  # changes are on bottle's default branch (or a bumped tag pkgx requires).
  windows-run:
    runs-on: windows-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          path: pkgx
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build pkgx.exe (native windows/amd64)
        working-directory: pkgx
        env:
          CGO_ENABLED: "0"
        run: go build -o pkgx.exe .

      - name: Fabricate a tiny windows bottle (hello.exe)
        shell: pwsh
        working-directory: pkgx
        run: |
          $proj = "hello.test"; $ver = "1.0.0"; $slug = "x86-64"
          New-Item -ItemType Directory -Force -Path hello | Out-Null
          @'
          package main
          import ("fmt"; "os")
          func main() {
              if len(os.Args) > 1 && os.Args[1] == "fail" { os.Exit(3) }
              fmt.Println("hello from pkgx bottle (win)")
          }
          '@ | Set-Content hello/hello.go
          # Native windows PE, the leaf tool of the bottle.
          Push-Location hello; go mod init hello.test 2>$null; go build -o hello.exe .; Pop-Location
          # Bottle tree: <proj>/v<ver>/bin/hello.exe  ->  gzip'd tar.
          $stage = "stage/$proj/v$ver/bin"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item hello/hello.exe "$stage/hello.exe"
          $dist = "dist/$proj/windows/$slug"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # bsdtar ships on windows-latest and supports -z for gzip.
          tar -c -z -f "$dist/v$ver.tar.gz" -C stage "$proj/v$ver"
          Set-Content "$dist/versions.txt" $ver
          # package.yml is served from the same root (PantryBase == DistBase).
          New-Item -ItemType Directory -Force -Path "dist/$proj" | Out-Null
          Set-Content "dist/$proj/package.yml" "provides:`n  - bin/hello`n"
          Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Serve dist/ and run pkgx.exe
        shell: pwsh
        working-directory: pkgx
        run: |
          # Serve the fixture with Go, not `python -m http.server`. On a Windows
          # runner `python` can resolve to the Microsoft Store app-execution
          # alias: a stub that exits without serving and without failing loudly.
          # That is exactly how this lane broke -- Start-Process reported no
          # error and the port was simply never open. Go is already required
          # here; python is not, and this is a Go project.
          # Build the server rather than `go run` it: the cleanup below stops
          # $srv, and `go run` would put the *launcher* there, leaving the real
          # listener orphaned. Building also keeps compilation out of the
          # readiness window below.
          $serve = Join-Path $env:RUNNER_TEMP 'testserve.exe'
          go build -o $serve .github\testserve\main.go
          if ($LASTEXITCODE -ne 0) { throw 'failed to build the fixture server' }
          # Pass an absolute directory: a started process does not inherit the
          # PowerShell location.
          $srv = Start-Process $serve -PassThru -ArgumentList '-dir',"$((Resolve-Path dist).Path)",'-addr','127.0.0.1:8199'
          # Wait for the port to accept instead of sleeping a guessed 3 seconds.
          # The old fixed sleep is what turned "no server at all" into a
          # confusing "connection refused" three seconds later; a deadline says
          # plainly which of the two happened.
          $deadline = (Get-Date).AddSeconds(120)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8199/' -TimeoutSec 2 | Out-Null
              $ready = $true
              break
            } catch {
              Start-Sleep -Milliseconds 300
            }
          }
          if (-not $ready) {
            throw 'fixture server never accepted on 127.0.0.1:8199'
          }
          Write-Host "fixture server is accepting on 127.0.0.1:8199"
          $env:PKGX_DIST   = "http://127.0.0.1:8199"
          $env:PKGX_PANTRY = "http://127.0.0.1:8199"
          $env:PKGX_DIR    = "$PWD\store"
          # This fixture is a static-HTTP dist of UNSIGNED bottles, and the
          # install path now enforces the fail-closed signature check (bottle#21),
          # so it would refuse every one of them. State the posture explicitly;
          # what this job proves is the Windows exec path, not verification.
          $env:PKGX_VERIFY = "0"
          try {
            # 1. output round-trip
            $out = (& .\pkgx.exe hello.test 2>&1 | Out-String).Trim()
            Write-Host "pkgx.exe hello.test => $out"
            if ($out -notmatch 'hello from pkgx bottle \(win\)') {
              throw "expected greeting, got: $out"
            }
            # 2. arg passing + exit-code propagation through execWindows
            & .\pkgx.exe hello.test fail
            if ($LASTEXITCODE -ne 3) {
              throw "expected exit code 3, got $LASTEXITCODE"
            }
            Write-Host "PROOF PASS: output round-trip + exit-code 3 propagated"
          } finally {
            Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
          }
          # The intentional exit-3 above left $LASTEXITCODE=3; the proof passed,
          # so end the step cleanly (else Actions fails it on the stray code).
          exit 0

  emulated:
    name: test (${{ matrix.goarch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            qemu: qemu-aarch64-static
          - goarch: riscv64
            qemu: qemu-riscv64-static
          - goarch: ppc64le
            qemu: qemu-ppc64le-static
          - goarch: s390x
            qemu: qemu-s390x-static
          - goarch: loong64
            qemu: qemu-loongarch64-static
    # Cross-COMPILING proves the code builds for an architecture. It says
    # nothing about whether it WORKS there, and the bugs a compiler cannot see
    # are exactly the interesting ones: a byte order read from the host rather
    # than from the format, an assumption about int width, a struct laid out
    # differently.
    #
    # s390x is here because it is BIG-ENDIAN and nothing else we run is.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          # Named, not assumed: a missing emulator must report itself as a
          # missing tool rather than as a failure on that architecture.
          command -v ${{ matrix.qemu }} || {
            echo "::error::${{ matrix.qemu }} is not in this image" >&2; exit 1; }
      - name: go test
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          GOOS: linux
        # -count=1 so a cached PASS from the host architecture cannot stand in
        # for a run that never happened under emulation.
        run: go test -count=1 -exec ${{ matrix.qemu }} ./...

  freebsd:
    name: test (FreeBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    # Cross-compiling proves the code builds for an OS. It says nothing about
    # whether it WORKS there, and the bugs a compiler cannot see are the
    # interesting ones: a path convention, a syscall that behaves differently,
    # an assumption that /proc is mounted.
    #
    # The toolchain never enters the VM — go.mod names a Go version no BSD
    # package set carries, and a lane that installed one would depend on what a
    # package mirror happens to hold that day. Same idiom as the qemu lanes:
    # build here, run there, the VM supplying only a kernel and a libc.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build freebsd
      # Pinned by commit, not by tag: a tag can be moved onto code we never read.
      - uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  netbsd:
    name: test (NetBSD, a kernel that is not Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build netbsd
      - uses: vmactions/netbsd-vm@7f23a491dcc69c34195721ab67934917707f84c7
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run

  openbsd:
    name: test (OpenBSD, the strictest kernel we can reach)
    runs-on: ubuntu-latest
    # OpenBSD is the one most likely to find something: W^X is enforced, malloc
    # is deliberately hostile (junk-filling, guard pages), and syscall origin is
    # policed. Code that merely happens to work elsewhere tends to stop here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: cross-compile the test binaries
        run: .github/scripts/bsd-tests.sh build openbsd
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          usesh: true
          run: .github/scripts/bsd-tests.sh run
